[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "progression-heatmap"
version = "0.1.0"
description = "Streamlit dashboard for Match-3 progression heatmap analytics."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "databricks-sdk>=0.33,<1",
    "databricks-sql-connector>=3.4,<5",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "pyspark>=4.0,<5",
    "streamlit>=1.37,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["notebooks"]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
