resources:
  jobs:
    source_update_daily:
      name: source update daily
      schedule:
        quartz_cron_expression: 0 0 8 * * ?
        timezone_id: Europe/Belgrade
        pause_status: UNPAUSED
      tasks:
        - task_key: source_update
          existing_cluster_id: 1211-181707-li2237rl
          notebook_task:
            notebook_path: ../notebooks/source update.ipynb
            base_parameters:
              RUN_ON_TEST_USERS: "False"
              LEVEL_COHORT_FRACTION: "100"
      notification_settings:
        no_alert_for_skipped_runs: true
      email_notifications:
        on_failure:
          - nikita.kudriashov@vokigames.com
      queue:
        enabled: true
